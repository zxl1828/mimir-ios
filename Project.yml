name: Mimir
options:
  bundleIdPrefix: com.zxl
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  KokoroCoreML:
    url: https://github.com/Jud/kokoro-coreml
    from: "0.8.0"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"
targets:
  Mimir:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Mimir/Info.plist
      properties:
        CFBundleDisplayName: Mimir
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: 语音对话需要访问麦克风，音频仅在本机处理，不会上传。
        NSSpeechRecognitionUsageDescription: 用于把你说的话在本机转成文字，识别完全离线完成。
        NSCameraUsageDescription: 用于拍照提问和扫描文档，图片只在你的设备上处理。
        NSPhotoLibraryUsageDescription: 用于从相册选取图片提问。
        NSPhotoLibraryAddUsageDescription: 用于把生成的图片保存到相册。
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.zxl.mimir.refresh
          - com.zxl.mimir.dailybrief
        UIBackgroundModes:
          - fetch
          - processing
    sources:
      - path: Mimir
        excludes:
          - "Resources/Models"
      # 语音模型以文件夹引用的方式整体打入 App Bundle，保持目录结构。
      - path: Mimir/Resources/Models
        type: folder
        optional: true
      - path: Shared
    dependencies:
      - package: KokoroCoreML
        product: KokoroCoreML
      - package: MCP
        product: MCP
      - target: MimirWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxl.mimir
        PRODUCT_NAME: Mimir
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: Mimir/Support/Mimir-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: YES
        OTHER_LDFLAGS: "$(inherited) -ObjC"
  MimirWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: MimirWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mimir
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: MimirWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxl.mimir.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
schemes:
  Mimir:
    build:
      targets:
        Mimir: all
        MimirWidgets: all
    run:
      config: Debug
    archive:
      config: Release
